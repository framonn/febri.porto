    <!-- Bottom strip -->
    <g transform="translate(30, 350)">
      <rect width="950" height="50" rx="8" fill="#1E293B" fill-opacity="0.4"/>
      <text x="25" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">
