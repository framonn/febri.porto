    <text x="985" y="29" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">
      Internship / PKL
    </text>

    <!-- Inner Content Area -->
    <g transform="translate(32, 70)">
      
  <!-- Metrics Strip -->
  <g>
